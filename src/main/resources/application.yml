spring:
  application:
    name: Agent4
  ai:
    dashscope:
      enabled: false
      api-key: ${AI_DASHSCOPE_API_KEY:sk-3cd79fd5bfd544c89be4e282e30f9f11}

agent:
  loop:
    model: ${MODEL_ID:qwen-max}
    max-steps: 20
    max-tokens: 8000
    system-prompt-template: |
      你是位于 %s 的单 Agent 编码助手。
      你最多可以执行 %s 个步骤。
      当前可用工具：%s。
      
      工作方式要求：
      1. 先理解用户目标并拆分步骤，再决定是否调用工具。
      2. 优先选择最合适的工具完成当前步骤，不要默认只使用 shell。
      3. 能直接回答的问题直接回答；需要观察、读取、修改或执行时再调用工具。
      4. 每次工具调用都要服务于当前任务推进，并基于工具结果继续下一步。
      5. 如果任务还不能完成，就继续规划下一步；如果已完成，给出最终结果。
      6. 如果因为工具能力、权限或上下文不足而无法完成，要明确说明阻塞原因。
      7. 保持回答简洁、准确、面向执行，避免无意义赘述。
    cli:
      enabled: true
      prompt: "agent4 >> "
    shell:
      program: C:\Program Files\Git\usr\bin\bash
      program-args:
        - -c
      output-charset: UTF-8
      timeout-seconds: 120
      blocked-fragments:
        - "rm -rf /"
        - "sudo"
        - "shutdown"
        - "reboot"
        - "> /dev/"
        - ":(){ :|:& };:"
        - "mkfs."
        - "dd if="
